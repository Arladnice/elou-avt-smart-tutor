[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "elou-tutor"
version = "0.1.0"
description = "Компьютерный тренажерный комплекс ЭЛОУ-АВТ Smart Tutor"
requires-python = ">=3.12"

[tool.setuptools.packages.find]
where = ["src"]

# Неисполняемые файлы обязаны попасть в установленный пакет: без этого
# dev-режим работает, а Docker-сборка падает на чтении сценариев или модели
[tool.setuptools.package-data]
elou_tutor = [
    "data/*.json",
    "knowledge_base/*.md",
    "ml/artifacts/*",
]

[tool.ruff]
exclude = [".venv", "training"]
line-length = 120

[tool.ruff.lint]
# Набор по умолчанию (E4 — импорты, E7 — синтаксические конструкции,
# E9 — ошибки разбора, F — pyflakes: реальные ошибки и мёртвый код).
select = ["E4", "E7", "E9", "F"]
# E402: main.py, routes/health.py и тесты дополняют sys.path до импортов,
# чтобы пакеты монорепозитория резолвились при прямом запуске файлов.
ignore = ["E402"]
