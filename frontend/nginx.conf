# Формат лога без query string — JWT-токен WebSocket передаётся в query
# и не должен оседать в access-логах
log_format no_query '$remote_addr - $remote_user [$time_local] '
                    '"$request_method $uri" $status $body_bytes_sent';

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # REST API — проксируем на бэкенд (путь /api/... сохраняется)
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket реального времени симулятора
    location /ws {
        access_log /var/log/nginx/access.log no_query;
        # warn-сообщения nginx печатают полный URI с токеном (например, при
        # дублирующемся заголовке Date от upstream) — поднимаем порог до error
        error_log /var/log/nginx/error.log error;
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        # симуляторные сессии длятся долго — не рвём соединение по таймауту
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # SPA-фолбэк для React Router
    location / {
        try_files $uri $uri/ /index.html;
    }
}
