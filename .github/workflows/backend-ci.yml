name: Backend CI

# Только pull request: на промежуточных коммитах в ветке проверки не гоняются.
# Джоба перезапускается автоматически при каждом новом пуше в ветку PR,
# поэтому состояние проверки всегда соответствует голове ветки.
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'backend/**'
      - 'simulator/**'
      - 'ai_core/**'
      - 'pyproject.toml'
      - '.github/workflows/backend-ci.yml'

# Новый пуш в ту же ветку отменяет ещё не завершившийся прогон
concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: Lint & Test (backend)
    runs-on: ubuntu-latest
    env:
      # Секреты обязательны: backend/utils/security.py падает на импорте без них.
      # Значения тестовые и используются только внутри прогона CI.
      INTEGRITY_SALT: ci-integrity-salt
      SECRET_KEY: ci-secret-key-for-tests-only-32b
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Совпадает с базовым образом Dockerfile (python:3.12-slim)
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r backend/requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Tests (pytest)
        run: pytest backend/tests -q
