name: Frontend CI

# Только pull request: на промежуточных коммитах в ветке сборка не гоняется.
# Джоба перезапускается автоматически при каждом новом пуше в ветку PR,
# поэтому состояние проверки всегда соответствует головe ветки.
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'

# Новый пуш в ту же ветку отменяет ещё не завершившийся прогон
concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-build:
    name: Lint & Build (frontend)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (oxlint)
        run: npm run lint

      - name: Typecheck & build (tsc + vite)
        run: npm run build
