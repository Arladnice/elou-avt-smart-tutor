name: Deploy

# ============================================================================
# Раскатка стека на хост по SSH: собираем архив из отслеживаемых файлов,
# копируем на сервер и поднимаем docker compose.
#
# Значения берутся из Variables репозитория
# (Settings → Secrets and variables → Actions → вкладка Variables):
#   DEPLOY_HOST       — IP или домен сервера
#   DEPLOY_USER       — пользователь SSH
#   DEPLOY_PASSWORD   — его пароль
#   INTEGRITY_SALT    — соль хэша целостности сессий
#   SECRET_KEY        — ключ подписи JWT
# Необязательная:
#   LLM_BASE_URL      — адрес OpenAI-совместимого сервера; без него ИИ-чат
#                       корректно деградирует до ответов по базе знаний
#
# TODO(deploy, безопасность): ПЕРЕД боевым использованием перенести DEPLOY_PASSWORD,
# INTEGRITY_SALT и SECRET_KEY из Variables в Secrets. Variables не маскируются в
# логах прогона и видны открытым текстом в интерфейсе репозитория — сейчас это
# допустимо только потому, что хост и данные тестовые.
#
# TODO(deploy, безопасность): перейти с пароля на SSH-ключ и завести отдельного
# пользователя вместо root. Пароль root даёт полный доступ к машине любому, кто
# может запустить workflow; ключ вдобавок не подбирается перебором.
# ============================================================================

on:
  push:
    branches: [main]

  # TODO(deploy): ВРЕМЕННЫЙ триггер — только чтобы проверить пайплайн до первого
  # мержа. Убрать сразу после успешной раскатки: иначе любой pull request катится
  # на боевой хост, то есть код из ветки попадает на прод до ревью.
  # Оговорка: PR из форков секретов не получают и упадут на шаге SSH — опасны
  # именно PR из веток этого же репозитория.
  pull_request:
    types: [opened, synchronize, reopened]

# Раскатки не должны накладываться друг на друга: группа одна на весь репозиторий,
# а не на ветку. cancel-in-progress выключен намеренно — прерванный на середине
# деплой оставил бы сервер в неопределённом состоянии.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to host
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Каталог приложения на сервере
      APP_DIR: /opt/elou-avt-smart-tutor
      # Имя compose-проекта закреплено явно. По умолчанию оно берётся из имени
      # каталога, и переезд каталога отвязал бы стек от тома с базой.
      COMPOSE_PROJECT: elou-avt-smart-tutor

    steps:
      - uses: actions/checkout@v4

      - name: Собрать архив из отслеживаемых файлов
        # git archive кладёт в архив ровно то, что в индексе: без node_modules,
        # без .venv и без локальных .env. Список исключений поддерживать не нужно.
        run: git archive --format=tar.gz -o /tmp/deploy.tar.gz HEAD

      - name: Подготовить backend/.env
        # Файл обязателен: docker-compose подключает его через env_file и без него
        # отказывается стартовать. Пишем на раннере и копируем файлом, а не
        # передаём значения в командной строке ssh — иначе они были бы видны
        # в списке процессов сервера.
        env:
          INTEGRITY_SALT: ${{ vars.INTEGRITY_SALT }}
          SECRET_KEY: ${{ vars.SECRET_KEY }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
        run: |
          set -euo pipefail
          : "${INTEGRITY_SALT:?не задана переменная INTEGRITY_SALT}"
          : "${SECRET_KEY:?не задана переменная SECRET_KEY}"
          umask 077
          {
            printf 'INTEGRITY_SALT=%s\n' "$INTEGRITY_SALT"
            printf 'SECRET_KEY=%s\n' "$SECRET_KEY"
            printf 'LLM_BASE_URL=%s\n' "${LLM_BASE_URL:-http://127.0.0.1:1234}"
          } > /tmp/deploy.env

      - name: Установить sshpass
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass

      - name: Скопировать на сервер
        env:
          SSHPASS: ${{ vars.DEPLOY_PASSWORD }}
          HOST: ${{ vars.DEPLOY_HOST }}
          # Не USER: на раннере это стандартная переменная, затенять её не стоит
          LOGIN: ${{ vars.DEPLOY_USER }}
        # sshpass -e читает пароль из переменной окружения: вариант -p оставил бы
        # его в списке процессов раннера.
        # TODO(deploy, безопасность): accept-new доверяет ключу хоста при первом
        # подключении — окно для MITM. Заменить на секрет DEPLOY_KNOWN_HOSTS
        # с заранее снятым отпечатком и StrictHostKeyChecking=yes.
        run: |
          set -euo pipefail
          SSH_OPTS="-o StrictHostKeyChecking=accept-new -o ConnectTimeout=15"
          sshpass -e ssh $SSH_OPTS "$LOGIN@$HOST" "mkdir -p '$APP_DIR'"
          sshpass -e scp $SSH_OPTS /tmp/deploy.tar.gz "$LOGIN@$HOST:/tmp/deploy.tar.gz"
          sshpass -e scp $SSH_OPTS /tmp/deploy.env "$LOGIN@$HOST:/tmp/deploy.env"

      - name: Развернуть стек
        env:
          SSHPASS: ${{ vars.DEPLOY_PASSWORD }}
          HOST: ${{ vars.DEPLOY_HOST }}
          # Не USER: на раннере это стандартная переменная, затенять её не стоит
          LOGIN: ${{ vars.DEPLOY_USER }}
        run: |
          set -euo pipefail
          SSH_OPTS="-o StrictHostKeyChecking=accept-new -o ConnectTimeout=15"
          sshpass -e ssh $SSH_OPTS "$LOGIN@$HOST" \
            "APP_DIR='$APP_DIR' COMPOSE_PROJECT='$COMPOSE_PROJECT' bash -s" <<'REMOTE'
          set -euo pipefail

          command -v docker >/dev/null || { echo "✗ На сервере нет docker"; exit 1; }
          docker compose version >/dev/null || { echo "✗ Нет плагина docker compose"; exit 1; }

          # Чистим каталог, но не трогаем сам путь: том с базой живёт в Docker и
          # привязан к имени compose-проекта, а не к содержимому каталога.
          # Так удалённые из репозитория файлы не остаются на сервере навсегда.
          cd "$APP_DIR"
          find . -mindepth 1 -delete

          tar xzf /tmp/deploy.tar.gz -C "$APP_DIR"
          install -m 600 /tmp/deploy.env "$APP_DIR/backend/.env"
          rm -f /tmp/deploy.tar.gz /tmp/deploy.env

          docker compose -p "$COMPOSE_PROJECT" up -d --build --wait --remove-orphans

          # Освобождаем место: без этого слои от прошлых сборок копятся до отказа диска
          docker image prune -f >/dev/null

          docker compose -p "$COMPOSE_PROJECT" ps
          REMOTE

      - name: Проверить, что сервис отвечает
        env:
          SSHPASS: ${{ vars.DEPLOY_PASSWORD }}
          HOST: ${{ vars.DEPLOY_HOST }}
          # Не USER: на раннере это стандартная переменная, затенять её не стоит
          LOGIN: ${{ vars.DEPLOY_USER }}
        # Проверяем изнутри сервера: наружу порт может быть закрыт файрволом,
        # и это не повод считать раскатку неудачной.
        run: |
          set -euo pipefail
          SSH_OPTS="-o StrictHostKeyChecking=accept-new -o ConnectTimeout=15"
          sshpass -e ssh $SSH_OPTS "$LOGIN@$HOST" \
            "COMPOSE_PROJECT='$COMPOSE_PROJECT' bash -s" <<'REMOTE'
          set -euo pipefail
          for i in $(seq 1 12); do
            if curl -fsS http://127.0.0.1:8000/api/health >/dev/null; then
              echo "✓ API отвечает"
              curl -fsS http://127.0.0.1:8080/ >/dev/null && echo "✓ Интерфейс отдаётся"
              exit 0
            fi
            sleep 5
          done
          echo "✗ /api/health не ответил за 60 секунд"
          docker compose -p "$COMPOSE_PROJECT" logs --tail=50 backend
          exit 1
          REMOTE

      - name: Удалить временные файлы с раннера
        # Раннер одноразовый, но шаг дешёвый и снимает вопрос при разборе сбоя
        if: always()
        run: rm -f /tmp/deploy.env /tmp/deploy.tar.gz
