[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "elou-avt-smart-tutor"
version = "0.1.0"
description = "Компьютерный тренажерный комплекс ЭЛОУ-АВТ Smart Tutor"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Smart Tutor Team" }
]

[tool.setuptools.packages.find]
where = ["."]
include = ["backend*", "simulator*", "ai_core*"]

[tool.ruff]
# Каталоги, которые линтер не проверяет: артефакты сборки и изолированные рабочие копии
exclude = [".agents", ".claude", ".venv", "frontend", "node_modules"]
line-length = 120

[tool.ruff.lint]
# Набор по умолчанию (E4 — импорты, E7 — синтаксические конструкции,
# E9 — ошибки разбора, F — pyflakes: реальные ошибки и мёртвый код).
select = ["E4", "E7", "E9", "F"]
# E402: модули backend/, ai_core/ и scripts/ дополняют sys.path до импортов,
# чтобы пакеты монорепозитория резолвились при прямом запуске файлов.
ignore = ["E402"]
