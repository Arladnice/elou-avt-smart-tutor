[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "elou-avt-smart-tutor"
version = "0.1.0"
description = "Компьютерный тренажерный комплекс ЭЛОУ-АВТ Smart Tutor"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Smart Tutor Team" }
]

[tool.setuptools.packages.find]
where = ["."]
include = ["backend*", "simulator*", "ai_core*"]

[tool.ruff]
# Каталоги, которые линтер не проверяет: артефакты сборки и изолированные рабочие копии
exclude = [".agents", ".claude", ".venv", "frontend", "node_modules"]
line-length = 120

[tool.ruff.lint]
# Набор по умолчанию (E4 — импорты, E7 — синтаксические конструкции,
# E9 — ошибки разбора, F — pyflakes: реальные ошибки и мёртвый код).
select = ["E4", "E7", "E9", "F"]
# E402: модули backend/, ai_core/ и scripts/ дополняют sys.path до импортов,
# чтобы пакеты монорепозитория резолвились при прямом запуске файлов.
ignore = ["E402"]

# ============================================================
# Контроль архитектуры: контракты слоёв проверяются lint-imports.
# Полное описание слоёв — docs/architecture.md, разделы 2 и 3.2.
# ============================================================
[tool.importlinter]
root_packages = ["backend", "simulator", "ai_core"]
include_external_packages = false

# --- Контракт 1: направление зависимостей внутри бэкенда ---
[[tool.importlinter.contracts]]
name = "Слои бэкенда: routes выше services"
type = "layers"
layers = ["backend.routes", "backend.services"]

# --- Контракт 2: нижние слои не знают о транспорте ---
# db и utils взаимно связаны намеренно (аудит пишет в БД, запросы сверяют хэши),
# поэтому они не разделены на слои, но обоим запрещено тянуть верхние слои.
[[tool.importlinter.contracts]]
name = "Слой данных и утилиты не зависят от routes/services"
type = "forbidden"
source_modules = ["backend.db", "backend.utils"]
forbidden_modules = ["backend.routes", "backend.services"]

# --- Контракт 3: схемы остаются чистыми контрактами ---
[[tool.importlinter.contracts]]
name = "Pydantic-схемы не зависят от остального кода"
type = "forbidden"
source_modules = ["backend.models"]
forbidden_modules = ["backend.routes", "backend.services", "backend.db", "backend.utils", "simulator", "ai_core"]

# --- Контракт 4: ИИ-ядро автономно ---
# Единственное допущение: ленивый импорт реестра сценариев внутри функции —
# ErrorAnalyzer берёт оттуда эталонную последовательность. Обёрнут в try/except,
# офлайн-скрипты (train/evaluate) работают без бэкенда.
[[tool.importlinter.contracts]]
name = "ai_core не зависит от backend (кроме реестра сценариев)"
type = "forbidden"
source_modules = ["ai_core"]
forbidden_modules = ["backend"]
ignore_imports = [
    "ai_core.error_analyzer -> backend.services.scenario_manager",
    "simulator.elou_avt_model -> backend.services.scenario_manager",
]

# --- Контракт 5: симулятор автономен ---
# То же допущение: initial_state сценария читается ленивым импортом в reset().
[[tool.importlinter.contracts]]
name = "simulator не зависит от backend (кроме реестра сценариев)"
type = "forbidden"
source_modules = ["simulator"]
forbidden_modules = ["backend"]
ignore_imports = [
    "simulator.elou_avt_model -> backend.services.scenario_manager",
]

# --- Контракт 6: ИИ-ядро не знает о симуляторе в рантайме ---
# Исключение — офлайн-генератор датасета: он специально крутит симулятор,
# чтобы получить синтетическую телеметрию для обучения.
[[tool.importlinter.contracts]]
name = "ai_core не зависит от simulator (кроме генератора датасета)"
type = "forbidden"
source_modules = ["ai_core"]
forbidden_modules = ["simulator"]
ignore_imports = [
    "ai_core.data_generator -> simulator.elou_avt_model",
]
